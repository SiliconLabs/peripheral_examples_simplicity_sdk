    - brd4117a             # efr32mg26
    - brd4181a             # efr32mg21
    - brd4182a             # efr32mg22
    - brd4186c             # efr32mg24
    - brd4194a             # efr32mg27
    - brd4204d             # efr32zg23
    - brd4270b             # efr32fg25
    - brd4400c             # efr32zg28

# Example-specific settings
